# Un passage attend la fin du pr√©c√©dent, sans l'annuler : rattrapages et passages ordinaires, dans le m√™me groupe, ne
# tournent jamais en m√™me temps (un rattrapage retient donc les passages planifi√©s). `queue: max` garde jusqu'√† 100
# ex√©cutions en attente, lanc√©es dans l'ordre o√π elles sont entr√©es dans le groupe : un rattrapage lanc√© pendant un
# passage attend sa fin et n'est plus remplac√© par le passage planifi√© suivant (par d√©faut, GitHub n'en garde qu'une
