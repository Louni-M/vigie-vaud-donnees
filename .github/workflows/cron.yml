# Il appelle le workflow r√©utilisable du d√©p√¥t principal avec le `GITHUB_TOKEN` du d√©p√¥t de donn√©es et pour seul
# secret `RETRAITS_CLE` (facultatif, ADR 0007). Pages doit y √™tre publi√© ¬´ par GitHub Actions ¬ª.
name: Cron

on:
